#
# Documentation for this file format can be found in "The Data Catalog"
# Link: https://docs.kedro.org/en/stable/data/data_catalog.html
#
# We support interacting with a variety of data stores including local file systems, cloud, network and HDFS
#
# An example data set definition can look as follows:
#
#bikes:
#  type: pandas.CSVDataset
#  filepath: "data/01_raw/bikes.csv"
#
#weather:
#  type: spark.SparkDataset
#  filepath: s3a://your_bucket/data/01_raw/weather*
#  file_format: csv
#  credentials: dev_s3
#  load_args:
#    header: True
#    inferSchema: True
#  save_args:
#    sep: '|'
#    header: True
#
#scooters:
#  type: pandas.SQLTableDataset
#  credentials: scooters_credentials
#  table_name: scooters
#  load_args:
#    index_col: ['name']
#    columns: ['name', 'gear']
#  save_args:
#    if_exists: 'replace'
#    # if_exists: 'fail'
#    # if_exists: 'append'
#
# The Data Catalog supports being able to reference the same file using two different Dataset implementations
# (transcoding), templating and a way to reuse arguments that are frequently repeated. See more here:
# https://docs.kedro.org/en/stable/data/data_catalog.html

companies:
  type: pandas.CSVDataset
  filepath: data/01_raw/companies.csv

reviews:
  type: pandas.CSVDataset
  filepath: data/01_raw/reviews.csv

shuttles:
  type: pandas.ExcelDataset
  filepath: data/01_raw/shuttles.xlsx
  load_args:
    engine: openpyxl

preprocessed_companies:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/preprocessed_companies.parquet

preprocessed_shuttles:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/preprocessed_shuttles.parquet

model_input_table:
  type: pandas.ParquetDataset
  filepath: data/03_primary/model_input_table.parquet

regressor:
  type: pickle.PickleDataset
  filepath: data/06_models/regressor.pickle
  versioned: true

shuttle_passenger_capacity_plot_exp:
  type: plotly.PlotlyDataset
  filepath: data/08_reporting/shuttle_passenger_capacity_plot_exp.json
  versioned: true
  plotly_args:
    type: bar
    fig:
      x: shuttle_type

# ============================================================================
# Aircraft Range Prediction Neural Network Pipeline (Data Science)
# Reference: specs/001-aircraft-range-prediction/data-model.md
# ============================================================================

# 01_raw: Raw aircraft data from source system
# Schema: aircraft_id, passenger_capacity, num_engines, crew_size, wingspace_m, length_m, range_km
aircraft_raw:
  type: pandas.CSVDataset
  filepath: data/01_raw/aircraft.csv
  metadata:
    owner: "data-science-team"
    source: "aircraft-database"
    refresh_frequency: "monthly"
    validation_schema: "5 numeric features + 1 target (range_km), ~500–1000 rows"

# 02_intermediate: Cleaned aircraft data (missing values imputed, outliers removed)
# Schema: aircraft_id, passenger_capacity, num_engines, crew_size, wingspace_m, length_m, range_km
aircraft_cleaned:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/aircraft_cleaned.parquet
  metadata:
    owner: "data-science-team"
    lineage: "aircraft_raw → (imputation, outlier removal)"

# 03_primary: Normalized features (StandardScaler applied)
# Schema: aircraft_id, passenger_capacity_normalized, num_engines_normalized, crew_size_normalized, wingspace_m_normalized, length_m_normalized, range_km
aircraft_features_normalized:
  type: pandas.ParquetDataset
  filepath: data/03_primary/aircraft_features_normalized.parquet
  metadata:
    owner: "data-science-team"
    lineage: "aircraft_cleaned → (StandardScaler normalization)"
    normalization_method: "standardscaler (μ≈0, σ≈1)"

# 05_model_input: Train/Val/Test split with assignments
# Schema: aircraft_id, passenger_capacity_normalized, num_engines_normalized, crew_size_normalized, wingspace_m_normalized, length_m_normalized, range_km, split
aircraft_train_test_split:
  type: pandas.ParquetDataset
  filepath: data/05_model_input/aircraft_train_test_split.parquet
  metadata:
    owner: "data-science-team"
    lineage: "aircraft_features_normalized → (train/val/test split 70/15/15)"
    split_strategy: "stratified (if aircraft_type available)"

# 06_models: Trained PyTorch neural network model
# Schema: PyTorch state_dict (.pt file) + metadata JSON
trained_model:
  type: pytorch.PyTorchModelDataset
  filepath: data/06_models/aircraft_range_model.pt
  metadata_filepath: data/06_models/aircraft_range_model_metadata.json
  versioned: true
  metadata:
    owner: "data-science-team"
    model_type: "torch.nn.Module (2-3 hidden layers, ReLU, Dropout)"
    versioning_strategy: "timestamp-based (aircraft_range_v1_YYYYMMDD_HHMMSS)"

# 07_model_output: Predictions on test/new data
# Schema: aircraft_id, predicted_range_km, range_lower_ci_km, range_upper_ci_km, prediction_confidence
predictions:
  type: pandas.ParquetDataset
  filepath: data/07_model_output/predictions.parquet
  metadata:
    owner: "data-science-team"
    lineage: "trained_model + aircraft_train_test_split → (MC Dropout inference)"
    prediction_method: "MC Dropout (10 forward passes for 95% CI)"

# 07_model_output: Evaluation metrics
# Schema: JSON with rmse_overall, r2_overall, mae_overall, rmse_by_type, r2_by_type, etc.
evaluation_metrics:
  type: text.TextDataset
  filepath: data/07_model_output/evaluation_metrics.json
  metadata:
    owner: "data-science-team"
    lineage: "trained_model + predictions → (performance evaluation)"
    metrics: "RMSE, R², MAE (overall + by aircraft type)"

# 07_model_output: Evaluation report
# Schema: Markdown report with per-type performance, drift detection, calibration checks
evaluation_report:
  type: text.TextDataset
  filepath: data/07_model_output/evaluation_report.md
  metadata:
    owner: "data-science-team"
    lineage: "evaluation_metrics + predictions → (formatted report)"
      y: passenger_capacity
      orientation: h
    layout:
      xaxis_title: Shuttles
      yaxis_title: Average passenger capacity
      title: Shuttle Passenger capacity

shuttle_passenger_capacity_plot_go:
  type: plotly.JSONDataset
  filepath: data/08_reporting/shuttle_passenger_capacity_plot_go.json
  versioned: true

dummy_confusion_matrix:
  type: matplotlib.MatplotlibDataset
  filepath: data/08_reporting/dummy_confusion_matrix.png
  versioned: true
