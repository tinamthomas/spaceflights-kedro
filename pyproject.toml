[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spaceflights"
version = "0.1.0"
description = "Kedro pipeline converted from simple notebook"
requires-python = ">=3.10"
dependencies = [
  "kedro>=1.4",
  "pandas>=1.0",
  "scikit-learn>=1.0",
  "openpyxl>=3.0",
]
